<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta property="og:title" content="FEEDBACK - Where live music lives." />
    <meta property="og:description" content="The nightly social video platform for live music. Fans capture moments, artists curate, and every night we celebrate the best in music." />
    <meta property="og:image" content="/og-feedback.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1536" />
    <meta property="og:image:height" content="1024" />
    <meta
      property="og:url"
      content="#"
    />
    <meta property="og:type" content="website" />
    <meta property="og:author" content="FEEDBACK" />
    <meta property="og:site_name" content="FEEDBACK" />
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:site" content="@momentum_live" />
    <meta property="twitter:title" content="FEEDBACK - Where live music lives." />
    <meta property="twitter:description" content="The nightly social video platform for live music. Fans capture moments, artists curate, and every night we celebrate the best in music." />
    <meta property="twitter:image" content="/og-feedback.png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="shortcut icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="preconnect" href="https://videodelivery.net" crossorigin />
    <link rel="dns-prefetch" href="https://videodelivery.net" />
    <title>FEEDBACK - Where live music lives.</title>
    <script>
      (function () {
        document.documentElement.setAttribute('data-theme', 'dark');
        var path = location.pathname;
        if (
          path.indexOf('/auth/callback') === 0 ||
          path.indexOf('/auth/reset-password') === 0 ||
          path.indexOf('/share/clip/') === 0
        ) {
          document.documentElement.setAttribute('data-skip-splash', '');
        }
      })();
    </script>
    <style>
      html[data-skip-splash] #app-splash {
        display: none !important;
      }
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #000;
        color: #fff;
        font-family: 'Plus Jakarta Sans', Inter, system-ui, sans-serif;
        transition: opacity 0.28s ease;
      }
      #app-splash.app-splash--done {
        opacity: 0;
        pointer-events: none;
      }
      #app-splash .app-splash-main {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.25rem;
      }
      #app-splash .app-splash-icon {
        width: 7.5rem;
        height: 7.5rem;
        border-radius: 1.35rem;
      }
      #app-splash .app-splash-title {
        margin: 0;
        font-size: 1.65rem;
        font-weight: 700;
        letter-spacing: -0.03em;
        text-align: center;
      }
      #app-splash .app-splash-footer {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.55rem;
        padding: 0 1.5rem max(2.5rem, env(safe-area-inset-bottom));
        text-decoration: none;
        color: inherit;
      }
      #app-splash .app-splash-powered {
        font-size: 0.7rem;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.8);
      }
      #app-splash .app-splash-jambase {
        width: min(11.5rem, 46vw);
        height: auto;
      }
    </style>
  </head>
  <body>
    <div id="app-splash" role="status" aria-live="polite" aria-label="Welcome to Feedback">
      <div class="app-splash-main">
        <img class="app-splash-icon" src="/favicon.svg" alt="" width="120" height="120" />
        <p class="app-splash-title">Welcome to Feedback</p>
      </div>
      <a
        class="app-splash-footer"
        href="https://www.jambase.com"
        target="_blank"
        rel="nofollow noopener noreferrer"
      >
        <span class="app-splash-powered">Powered By</span>
        <img class="app-splash-jambase" src="/brands/jambase-wordmark.svg" alt="JamBase" />
      </a>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/react-app/main.tsx"></script>
  </body>
</html>
